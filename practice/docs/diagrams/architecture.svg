<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="790" viewBox="0 0 1080 790" role="img" aria-labelledby="title desc">
  <title id="title">swe-prac architecture while you practise</title>
  <desc id="desc">The app is static files, built by tools/build_static.py into site/ and served as they are by GitHub Pages or build_static.py --serve. Everything runs in one browser tab. The pages (app.js, algo.js, design.js) call api(), which is a function in backend.js, not a server: it keeps sessions, the timer, level unlocks and scoring, and stores your history in localStorage, which the History page can export and import as a JSON file. For Lint and Format, backend.js calls lint.js, which runs ruff compiled to WebAssembly on the page. For Run, Submit and Run scratch it calls python.js, which hands the job to a fresh Web Worker and ends the worker at 10 seconds, or at 1.5 times a test's own time limit. The worker, py-worker.js, runs Pyodide (CPython 3.14 compiled to WebAssembly), which runs runner.py for Run and Submit or scratch.py for Run scratch. A spare worker is started ahead of the next job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b5"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #9aa3b5; }
    .t { font-size: 15px; font-weight: 600; fill: #e6e8ee; }
    .m { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-size: 14px; fill: #e6e8ee; }
    .c { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-size: 12.5px; fill: #c9cfdb; }
    .l { font-size: 12px; fill: #9aa3b5; }
    .proc { fill: #4f8cff; fill-opacity: 0.1; stroke: #4f8cff; stroke-width: 1.5; }
    .host { fill: #4f8cff; fill-opacity: 0.04; stroke: #4f8cff; stroke-opacity: 0.6; stroke-width: 1.5; }
    .mod { fill: #161922; stroke: #3a4154; stroke-width: 1.2; }
    .file { fill: #d29922; fill-opacity: 0.1; stroke: #d29922; stroke-opacity: 0.8; stroke-width: 1.2; }
    .edge { fill: none; stroke: #9aa3b5; stroke-width: 1.5; }
  </style>

  <rect width="1080" height="790" rx="12" fill="#0f1115"/>

  <!-- The built site -->
  <rect class="file" x="24" y="24" width="1032" height="92" rx="8"/>
  <text x="44" y="52"><tspan class="t">Static files</tspan><tspan class="c" dx="10">site/</tspan>, built by <tspan class="c">tools/build_static.py</tspan></text>
  <text x="44" y="76"><tspan class="c">index.html</tspan> and the pages' scripts · <tspan class="c">data.json</tspan>: questions, study pages, reviews · <tspan class="c">tests/</tspan>: every test</text>
  <text x="44" y="98"><tspan class="c">py/runner.py</tspan> · <tspan class="c">vendor/</tspan>: Pyodide, ruff, Monaco · served as they are by GitHub Pages or <tspan class="c">build_static.py --serve</tspan></text>

  <path class="edge" d="M540,116 V170" marker-end="url(#arrow)"/>
  <text class="l" x="552" y="147">fetched by the page; Pyodide and ruff once, then from the browser's cache</text>

  <!-- The browser tab -->
  <rect class="host" x="24" y="170" width="1032" height="350" rx="10"/>
  <text x="44" y="200"><tspan class="t">Browser tab</tspan><tspan dx="10">no server behind it: every</tspan><tspan class="c" dx="5">api()</tspan><tspan dx="5">call is a function call</tspan></text>

  <rect class="mod" x="48" y="224" width="290" height="92" rx="6"/>
  <text class="m" x="64" y="252">app.js · algo.js · design.js</text>
  <text x="64" y="276">home, sessions, review, history</text>
  <text x="64" y="298">Monaco editor, timer, pause overlay</text>

  <path class="edge" d="M338,270 H398" marker-end="url(#arrow)"/>
  <text class="l" x="368" y="262" text-anchor="middle">api()</text>

  <rect class="mod" x="398" y="224" width="330" height="92" rx="6"/>
  <text class="m" x="414" y="252">backend.js</text>
  <text x="414" y="276">routes, sessions, timer, level unlocks</text>
  <text x="414" y="298">scoring, history export and import</text>

  <path class="edge" d="M728,270 H788" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="file" x="788" y="224" width="244" height="92" rx="6"/>
  <text class="m" x="804" y="252">localStorage</text>
  <text x="804" y="276">your history, under one key</text>
  <text x="804" y="298">Export / Import: a JSON file</text>

  <!-- backend.js to the two runtimes -->
  <path class="edge" d="M563,316 V348"/>
  <path class="edge" d="M300,348 H830"/>
  <path class="edge" d="M300,348 V380" marker-end="url(#arrow)"/>
  <path class="edge" d="M830,348 V380" marker-end="url(#arrow)"/>
  <text class="l" x="310" y="370">Run / Submit / Run scratch</text>
  <text class="l" x="840" y="370">Lint / Format</text>

  <rect class="mod" x="150" y="380" width="300" height="114" rx="6"/>
  <text class="m" x="166" y="408">python.js</text>
  <text x="166" y="432">hands each job to a fresh worker</text>
  <text x="166" y="454">and ends the worker at 10 s, or at</text>
  <text x="166" y="476">1.5 × a test's own time limit</text>

  <rect class="mod" x="680" y="380" width="300" height="114" rx="6"/>
  <text class="m" x="696" y="408">lint.js</text>
  <text x="696" y="432">ruff compiled to WebAssembly,</text>
  <text x="696" y="454">on the page: lint as you type</text>
  <text x="696" y="476">rules: <tspan class="c">swe_prac/user_ruff*.toml</tspan></text>

  <path class="edge" d="M300,494 V570" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="312" y="536">postMessage: the job in, the results out as each test ends</text>

  <!-- One worker per job -->
  <rect class="proc" x="24" y="570" width="1032" height="156" rx="10"/>
  <text x="44" y="598"><tspan class="t">Web Worker</tspan><tspan class="c" dx="10">py-worker.js</tspan><tspan dx="10">one per job, thrown away after it; a spare one is started ahead</tspan></text>

  <rect class="mod" x="48" y="616" width="300" height="88" rx="6"/>
  <text class="m" x="64" y="644">Pyodide</text>
  <text x="64" y="668">CPython 3.14 in WebAssembly</text>
  <text x="64" y="690">no threads, a small C stack</text>

  <path class="edge" d="M348,660 H390" marker-end="url(#arrow)"/>

  <rect class="mod" x="390" y="616" width="300" height="88" rx="6"/>
  <text class="m" x="406" y="644">runner.py</text>
  <text x="406" y="668">Run / Submit: a new instance of</text>
  <text x="406" y="690">your class for each test</text>

  <path class="edge" d="M369,660 V712 H711 V660 H732" marker-end="url(#arrow)"/>

  <rect class="mod" x="732" y="616" width="300" height="88" rx="6"/>
  <text class="m" x="748" y="644">scratch.py</text>
  <text x="748" y="668">Run scratch, as a program beside</text>
  <text x="748" y="690">your solution.py (and helpers.py)</text>

  <!-- Legend -->
  <rect class="proc" x="48" y="750" width="18" height="12" rx="2"/>
  <text class="l" x="76" y="760">a Web Worker: its own thread and interpreter</text>
  <rect class="mod" x="390" y="750" width="18" height="12" rx="2"/>
  <text class="l" x="418" y="760">a script or runtime</text>
  <rect class="file" x="620" y="750" width="18" height="12" rx="2"/>
  <text class="l" x="648" y="760">files and storage</text>
</svg>
