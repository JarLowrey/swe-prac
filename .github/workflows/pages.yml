name: Deploy site

# Builds the site (it runs entirely in the browser), tests it, and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The browser's runtimes (Python, ruff, Java, C++), downloaded by the build at the versions it
      # pins, and the C++ headers it precompiles. An older cache still has the downloads.
      - uses: actions/cache@v4
        with:
          path: practice/.cache
          key: runtimes-${{ hashFiles('practice/tools/build_static.py', 'practice/tools/build_cpp_pch.mjs', 'practice/swe_prac/static/compilers.js', 'practice/swe_prac/static/lang/cpp/include/**') }}
          restore-keys: runtimes-
      - run: pip install -r practice/requirements.txt
      - run: python build.py
      # The practice tests import swe_prac from practice/, and the browser tests use the built site.
      - run: python -m unittest discover -s tests
        working-directory: practice
      - run: node --test "tests/js/*.test.mjs"
        working-directory: practice
        env:
          SWE_PRAC_SITE: ${{ github.workspace }}/site/practice
      - run: python -m unittest discover -s jobs/tests
      - run: node --test "jobs/tests/js/*.test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
